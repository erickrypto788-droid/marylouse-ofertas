name: Limpar ofertas expiradas

on:
  workflow_dispatch:

  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: cleanup-expired-offers
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar site
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências opcionais
        run: |
          python -m pip install --upgrade pip
          pip install pillow || true

      - name: Limpar ofertas expiradas
        run: |
          python scripts/cleanup_expired_offers.py

      - name: Regenerar páginas SEO
        run: |
          if [ -f scripts/generate_all_category_pages.py ]; then
            python scripts/generate_all_category_pages.py
          fi

          if [ -f scripts/generate_special_pages.py ]; then
            python scripts/generate_special_pages.py
          fi

      - name: Regenerar materiais orgânicos
        run: |
          if [ -f scripts/organic_publish.py ]; then
            python scripts/organic_publish.py
          fi

          if [ -f scripts/generate_pinterest_png.py ]; then
            python scripts/generate_pinterest_png.py
          fi

          if [ -f scripts/organic_daily_plan.py ]; then
            python scripts/organic_daily_plan.py
          fi

          if [ -f scripts/generate_pinterest_today.py ]; then
            python scripts/generate_pinterest_today.py
          fi

          if [ -f scripts/generate_whatsapp_today.py ]; then
            python scripts/generate_whatsapp_today.py
          fi

      - name: Commit automático
        run: |
          git config user.name "marylouse-bot"
          git config user.email "marylouse-bot@users.noreply.github.com"

          git add data/offers.json || true
          git add ofertas-*.html cupons-shopee.html sitemap.xml feed.xml feed.html rss.xsl || true
          git add growth/cards || true
          git add growth/pinterest || true
          git add growth/output || true

          if git diff --cached --quiet; then
            echo "Nenhuma oferta expirada para remover."
            exit 0
          fi

          git commit -m "Remove ofertas expiradas"

          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "Push falhou. Tentativa $i/3..."
            sleep 5
          done

          echo "Falha ao enviar limpeza."
          exit 1

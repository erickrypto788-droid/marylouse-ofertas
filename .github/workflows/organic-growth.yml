name: Organic Growth

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "data/offers.json"
      - "scripts/generate_all_category_pages.py"
      - "scripts/organic_publish.py"
      - ".github/workflows/organic-growth.yml"

permissions:
  contents: write

concurrency:
  group: organic-growth
  cancel-in-progress: false

jobs:
  organic-growth:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar site
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Gerar paginas SEO por categoria
        run: |
          if [ -f scripts/generate_all_category_pages.py ]; then
            python scripts/generate_all_category_pages.py
          else
            echo "scripts/generate_all_category_pages.py não encontrado."
          fi

      - name: Gerar feed e cards organicos
        run: |
          python scripts/organic_publish.py

      - name: Commit automatico dos arquivos gerados
        run: |
          git config user.name "marylouse-bot"
          git config user.email "marylouse-bot@users.noreply.github.com"

          git add ofertas-*.html sitemap.xml feed.xml feed.html rss.xsl || true
          git add growth/cards || true

          if git diff --cached --quiet; then
            echo "Nenhuma mudança para salvar."
            exit 0
          fi

          git commit -m "Atualiza SEO, feed e cards organicos"

          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "Push falhou. Tentativa $i/3..."
            sleep 5
          done

          echo "Falha ao enviar alterações."
          exit 1
